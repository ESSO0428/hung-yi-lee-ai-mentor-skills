[project]
name = "hung-yi-lee-ai-mentor-tools"
version = "0.2.0"
description = "Optional analysis tools for the Hung-yi Lee AI mentor skill"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
]
torch = [
  "torch>=2.2",
]
torch-cu126 = [
  "torch>=2.2",
]
torch-cu132 = [
  "torch>=2.2",
]
all = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[tool.uv]
package = false
conflicts = [
  [{ extra = "torch" }, { extra = "torch-cu126" }, { extra = "torch-cu132" }],
  [{ extra = "all" }, { extra = "torch-cu126" }],
  [{ extra = "all" }, { extra = "torch-cu132" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch" },
  { index = "pytorch-cpu", extra = "all" },
  { index = "pytorch-cu126", extra = "torch-cu126" },
  { index = "pytorch-cu132", extra = "torch-cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
